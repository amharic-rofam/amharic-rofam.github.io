<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, content-copiable=no">
    <title>ሮፋም የአማርኛ ሰዋሰው ጥያቄዎች 
    </title>
    <style>
        .root{
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --dark: #0f172a;
            --card: #1e293b;
            --gold: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color:#0f172a;
            color: cyan;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 { color: var(--gold); margin: 0; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        /* Progress Bar */
        .progress-wrapper { margin: 20px 0; }
        .bar-bg { background: #334155; height: 12px; border-radius: 10px; overflow: hidden; }
        #progress-fill { background-color:gold; height: 100%; width: 0%; transition: 0.8s; }

        /* Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .topic-btn {
            background: #334155;
            color:bisque;
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        .topic-btn.mastered { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }

        /* Quiz UI */
        .question-title{
            color: aqua;

        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #163042;
            color: white;
            border: 3px solid transparent;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            transition: 0.2s;
        }

        /* Color States */
        .correct-glow { border-color: var(--success) !important; background: rgba(34, 197, 94, 0.2) !important; }
        .wrong-glow { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.2) !important; }

        #explanation-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border-left: 4px solid var(--gold);
            display: none;
        }

        .next-btn {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: var(--dark);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            cursor: pointer;
        }

        .verified-badge { width: 18px; height: 18px; fill: #1DA1F2; }
        .logo-area { display: flex; align-items: center; gap: 5px; font-size: 1.2rem; font-weight: 800; }
        .hidden { display: none; }
        footer { margin-top: 25px;color:gold; color: var(--gold); font-weight: bold; letter-spacing: 1px; }
        .header-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .telegram-logo {
      width: 40px;
      height: 40px;
    }
    .header-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .email-logo {
      width: 40px;
      height: 40px;
    }
    .animation{
        overflow:hidden;
        position:relative;
        width:300px;
        padding:4px;
        border-radius:10px;
        display:flex;
        justify-content:center;
        align-items:center
    }
    .animation::before{
       z-index:-2;
       content:"";
       position:absolute;
       height:50%;
       width:150%;
       background:conic-gradient(#ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
        animation:spin 5s linear infinite
         }
    @keyframes spin{
       0%{
     transform:rotate(0deg)
      } 
     100%{
            transform:rotate(360deg)
     }   
    }
    .inner-content{
        z-index:1;
        padding:4px;
        border-radius:10px;
        height:100%;
        width:100%;
        background-color:#1a1a1a
    }
    #close-about{
           display:flex;
            justify-content:right;
            align-items:right;
            box-shadow:0px 0px 8px cyan
}
 @keyframes type{
     0%{
         transform:translate(-50vw)
     }
     50%{
     transform:scale(0.7)
     }
     100%{
    transform : scale(1)
     }       
     }
   @keyframes typing{
      from{width:0;}
      to { width:100%;}       
    }
@keyframes blink{
      from,to{border-color:transparent}
    50%{border-color:}
}
 </style>
</head>

<div class="container hidden" id="quiz-screen">

    <footer id="version-text" style="color:#d0d9df">ስሪት 1.0</footer>
   <script>
         const data = {
            "ስም": { q: [{t: "የተጸውኦ ስም የሆነው የትኛው ነው?", o: ["ከተማ", "ኪሊማንጃሮ ተራራ", "ሰራዊት","ደግነት"], a: 1, e:"የተፀውኦ ስሞች አንድ ተለይቶ የሚታወቅ ነገርን ብቻ ይገልፃሉ። "},{t:"ስም ማለት ምን ማለት ነው?", o: ["የግስ ጭማሪ ማለት ነው::", "የማንኛውም ነገር መጠሪያ ማለት ነው::","ከስም በፊት እና በኋላ እየገባ ስምን የሚገልጽ ነው::","አ/ነገር እና አ/ነገርን የሚያይዝ ነው::"], a: 1, e:"ስም የሌለው ነገር የለም።"}, {t: "ስም የሆነው የቱ ነው?", o: ["መሮጥ", "በፍጥነት","ረጅም","ወፍ"], a: 3,e:"ወፍ የጥቅል ስም ነው።"}, {t: "የስም አይነት ያልሆነው የቱ ነው? ", o: ["የሁኔታ ተውሳከ ግስ", "የወል ስም","የጥቅል ስም","የረቂቅ ስም"], a: 0,e:"የሁኔታ ተውሳከ ግስ የተውሳከ ግስ አይነት ነው።"},{t: "የረቂቅ ስም የሆነው የትኛው ነው?", o: ["ፍቅር", "ትህትና","ሀዘን","ሁሉም"], a: 3,e:"ሁሉም ሊታዩ ወይም ሊዳሰሱ አይችሉም።"}]},
            "ተውላጠ ስም": { q: [{t: "ሁለተኛ መደብ ብዙ ቁጥር የሆነው ተውላጠ ስም የቱ ነው?", o: ["እነሱ", "እናንተ","እኔ","እኛ"], a:1, e:"''አንተ'' እና ''አንቺ'' የሚባሉትን ሁለተኛ መደብ ነጠላ ቁጥር ተውላጠ ስሞችን በጋራ ለመጥራት ''እናንተ'' የሚለውን ሁለተኛ መደብ ብዙ ቁጥር እንጠቀማለን።"}, {t: "የተውላጠ ስም ጥቅም የሆነው የቱ ነው?", o: ["የሀሳብ መዛባት ያመጣል::", "ግስን ይገልፃል::","ስምን ይተካል::","አላስፈላጊ ይሰጣል ድግግሞሽን ያስወግዳል::","3ተኛውና አራተኛው መልስ ናቸው::"], a: 4,e:"ለምሳሌ:- ''አስቴር ጎበዝ ተማሪ ናት። እሷ ከክፍሏ  አንደኛ ትወጣለች።'' ማለት ብንፈልግ አስቴርን ንዴ ከገለፅን ሌላ ሰው ካልገለፅን ይሆንን ሰዋሰዋዊ ስርዓት መከተል እንችላለን። በዚህም የስም ድግግሞሽን እናስቀራለን።"}, {t: "ሦስተኛ ምድብ አንስታይ ፆታ ተውላጠ ስም የሆነው የቱ ነው?", o: ["እሱ", "እነሱ","እሷ","አንቺ"], a: 2,e:"እሷ የሚለው ተውላጠ ስም ሶስተኛ መደብ አንስታይ ፆታን ያመለክታል።"}, {t: "ተውላጠ ስም በስንት መድብ የተከፋፈለ ነው::", o: ["በስምንት", "በሶስት","በአምስት","በሁለት"], a: 1,e:"በሶስት ምድብ የተከፋፈለ ሲሆን እነሱም አንደኛ መደብ፣ሁለተኛ መደብ እና ሶስተኛ መደብ ናቸው "}, {t: "ነጠላ ቁጥር የሆነ አንደኛ መደብ ተውላጠ ስም የሆነው የቱ ነው?", o: ["እሷ", "እርስዎ","እናንተ","እኔ"], a: 3,e:"እኔ የሚለው ራስን የሚመለክት ለሁለቱም ፆታዎች የሚሆን አንደኛ መደብ ነጠላ ቁጥር ተውላጠ ስም ነው።"}]},
            "ግስ": { q: [{t: "ግስ በአረፍተ ነገር ውስጥ ምን ሊሆን ይችላል?", o: ["የአርፍተ ነገር መቋጫ", "ድርጊት","ድርጊት የፈፀመው አካል","አንደኛው እና ሁለተኛው መልስ ናቸው"], a: 3,e:"ግስ በአርፍተ ነገር ውስጥ መጨረሻ ላይ አርፍተነገሩን በድርጊት ይደመድማል ወይም በባለቤት የተፈፀመ፤በተሳቢ ላይ የሚፈፀም ድርጊትን የሚያመለክት የቃል ክፍል ነው።"}, {t: "የግስ አይነቶች ከሚባሉት ውስጥ ያልሆነው የቱ ነው?", o: ["የድርጊት ግስ", "ወደረኛ መስተፃምር","የመኖር ግስ","የመሆን ግስ"], a: 1,e:"ወደረኛ መስተፃምር ሁለት ነገሮችን የሚያወዳድር የመስተፃምር አይነት ነው።"}, {t: "ከሚከተሉት ውስጥ የድርጊት ግስ የሆነው የቱ ነው?", o: ["ሰበረ", "አለ","ነው","በተጨማሪ"], a: 0,e:"''ሰበረ'' አንድን ነገር የመስበር ድርጊትን የሚያሳይ የድርጊት ግስ ነው።"},{t:"የድርጊት ግስ አይነት የሆኑት የትኞቹ ናቸው?", o:["ሳቢ (ተሻጋሪ ግስ)","ጠቋሚ መስተፃምር","ኢ-ሳቢ (የማይሻገር ግስ)","ከሁለተኛው በስተቀር ሁሉም መልስ ናቸው"],a:3,e:"ሳቢ ግስ ባለቤትን እና ተሳቢን የሚያካትት የድርጊት ግስ አይነት ሲሆን ኢ-ሳቢ ግስ ደግሞ ድርጊቱ በባለቤቱ ላይ ያለቀ ብቻ መሆኑን የሚያመለክት የድርጊት ግስ አይነት ነው።"},{t:"ከሚከተሉት ውስጥ ሳቢ ግስ የሆነው የቱ ነው?",o:["ተኛ","ሽጠ","ሄደ","መጣ"],a:1,e:"''ሸጠ'' የሚለው ግስ የመሸጥ ድርጊት የፈፀመ አካልና የተፈፀመበት አካል እንዳለ ያመለክታል። ስለዚህ ሳቢ ግስ ነው።"}]},
            "ቅፅል": { q: [{t: "ቅፅል ማለት ምን ማለት ነው?", o: ["ለስም የተሰጠ ሌላኛው መጠሪያ ማለት ነው።", "የስም ገላጭ ማለት ነው።","ከግስ በፊት እየገባ ግስን የሚገልፅ ነው።","ድርጊት ተቀባይ ነው።"], a: 1,e:"ቅፅል ማለት ስምን የሚገልፅ የቃል ክፍል ነው፡፡ "}, {t: "ባህሪ አመልካች ቅፅል የሆነው የቱ ነው?", o: ["ቀያይ", "ንቁ","ጎበዝ","ሁለተኛውና ሦስተኛው መልሥ መሆን ይችላሉ"], a: 3,e:"ንቁ ንቃትን፤ጎበዝ ጉብዝናን የሚገልፁ የባህሪ ቅፅሎች ናቸው፡፡"}, {t: "ቅፅል ከስም በስተየት ሊገኝ ይችላል?", o: ["በስተግራ እና በስተቀኝ", "በመሀል","በግርጌ","ከግስ በፊት"], a: 0,e:"ቅፅል ከስም በፊት እና በኋላ በመግባት ስምን የበለጠ የሚገልፅ የቃል ክፍል ነው።"}, {t: "የመጠን ቅፅል የሆነው የቱ ነው?", o: ["ቀጭን", "ወፍራም","ደንዳና","ሁሉም"], a: 3,e:"ሁሉም የአንድን ነገር መጠን የሚገልፁ መጠን አመልካች ቅፅሎች ናቸው።"}, {t: "ቅፅል የሆነው የትኛው ነው?", o: ["በፍጥነት", "እስያ","ጠይም","ወደ"], a: 2,e:"ጠይም አይነት አመልካች ቅፅል ነው።"}]},
            "ተውሳከ ግስ": { q: [{t: "''ተውሳክ'' ማለት ምን ማለት ነው?", o: ["የግዕዝ ቃል ሲሆን ''ጭማሪ'' ማለት ነው።", "ግስን እና ግስን የሚያገናኝ ማለት ነው።","የግስ ገላጭ ማለት ነው።","ስምን የሚተካ ነው።"], a: 0,e:"''ተውሳክ'' የግዕዝ ቃል ሲሆን በአማርኛም ''ጭማሪ'' ማለት ነው።"}, {t: "ተውሳከ ግስ ከግስ በፊት እየገባ_____በመሆን ያገለግላል", o: ["የስም ገላጭ", "መጠን አመልካች ቅፅል","የግስ ገላጭ","መልስ አልተሰጠም"], a: 2,e:"''ተውሳክ'' በግዕዝ ''ጭማሪ'' ማለት ከሆነ ተውሳከ ግስ ደግሞ የግስ ጭማሪ ማለት ስለሆነ ተውሳከ ግስ ከግስ በፊት በመግባት ስለግሱ ተጨማሪ መረጃ ይሰጣል።"}, {t: "የሁኔታ ተውሳከ ግስ የሆነው የትኛው ነው?", o: ["በፍጥነት", "ክፉኛ","በሀይል","ሁሉም"], a: 3,e:"ለምሳሌ:-''በፍጥነት'' የሚለውን ቃል ''አበበ ከት/ቤት በፍጥነት መጣ።'' በሚለው አ/ነገር ውስጥ አስገብተን ብናየው አበበ የመጣበትን ሁኔታ ይገልጻል፤ ስለዚህ የሁኔታ ተውሳከ ግሶች አንድ ድርጊት የተፈጸመበትን አኳኋን ይገልጻሉ። በዚህ አ/ነገር ውስጥም ሶስቱም አማራጮች አንድ ነገር የተፈፀመበትን ሁኔታ በማሳየት ግሱን ይገልፃሉ።"}, {t: "ውልድ ተውሳከ ግስ እና ነባር ተውሳከ ግስ በምን ይለያሉ?", o: ["የሁኔታ ተውሳከ እና የጊዜ ተውሳከ ግሶችን በማካተታቸው", "ውልድ ተውሳከ ግሶች ''-ኛ'' የሚለውን ቅጥያ ስለሚወስዱ","ሁለቱም የተለያዩ የተውሳከ ግስ አይነቶች በመሆናቸው ","መልስ አልተሰጠም"], a: 1,e:"በአማርኛ ውስጥ ያሉ ተውሳከ ግሶች ጥቂት ቢሆኑም ውልድ እና ነባር ተብለው ይከፈላሉ። ውልድ ተውሳከ ግሶች ''-ኛ'' የሚለውን ቅጥያ ይወስዳሉ። ለምሳሌ፦ክፉኛ፣ጅልኛ፣ምንኛ፣ግምኛ ወ.ዘተ"}, {t: "የጊዜ አመልካች ተውሳከ ግስ የሆነው የቱ ነው?", o: ["ትናንትና", "በጠዋት","ሲመሽ","ሁሉም"], a: 3,e:"ሁሉም አማራጮች አንድ ድርጊት የተፈፀመበትን ጊዜ የሚያመለክቱ የጊዜ ተውሳከ ግሶች ናቸው። ለምሳሌ፦''አበበ ትናንትና መጥቶ ሄደ።'' ብንል ''ትናንትና'' የሚለው ቃል አበበ የመጣበትን ጊዜ (የመምጣትና የመሄድ ድርጊት የተፈጸመበትን ጊዜ) ይገልፃል።"}]},
            "አያያዦች": { q: [{t: "አያያዥ ምን እና ምንን ያያይዛሉ?", o: ["ቃልና ቃልን", "ሀረግ እና ሀረግን","አርፍተነገር እና አረፍተነገርን","ሁሉም"], a: 3,e:"አያያዥ ቃላት ቃልን ከቃል፤ ሀረግን ከሀረግ ፤ አርፍተ-ነገርን ከአርፍተ-ነገር ለማያያዝ የሚጠቅሙ የአንድን ፅሁፍ አፃፃፍ ስርዓት የሚያስተካክሉ ቃላት ናቸው።"}, {t: "አያያዦች ከሚያያይዙት ሀሳብ አንፃር በሁለት ይከፈላል። ምን አይነት ሀሳብ ያላቸውን ሊያይዝ ይችላል? ", o: ["ተመሳሳይ ሀሳብ ያላቸውን ሁለት ሀሳቦች ", "ተቃራኒ ሀሳብ ያላቸውን ሁለት ሀሳቦች","የአንደኛውና የሁለተኛው መልስ ናቸው።","ፊደልና ፊደልን"], a: 2,e:""}, {t: "ተመሳሳይ ሀሳብን የሚያይዙት አያያዦች ከሚከተሉት ውስጥ የትኞቹ ናቸው?", o: ["ስለሆነም", "ነገር ግን","ሆኖም ግን","በተጨማሪም","የአንደኛውና የአራተኛው መልስ መሆን ይችላሉ"], a: 4,e:""}, {t: "ተቃራኒ ሀሳብን የሚያይዙት አያያዦች ከሚከተሉት ውስጥ የትኛው ነው?", o: ["በተጨማሪም", "ዳሩ ግን","በመሆኑም","ከዚህም በላይ"], a: 1,e:""}, {t: "''ጤና አዳም ለቅመማ ቅመምነት ያገለግላል፤_____ከሻይ ጋርም ሊቀርብ ይችላል።''ይህንን አርፍተ ነገር ለማሟላት ሊስማማው የሚችለው ከሚከተሉት ውስጥ የትኛው አያያዥ ቃል ነው?", o: ["በተጨማሪም", "ይሁን እንጂ","እና","በመሆኑም"], a: 0,e:""}]},
            "ስርዓተ-ነጥብ": { q: [{t: "የስርዓተ ነጥቦች ጠቀሜታ ምንድን ነው?", o: ["የፅሁፍን ሀሳብ ላለማዛባት", "አነጋገርን በፅሁፍ ለመግለፅ ስንፈልግ ለመግለፅ","ፅሁፍን ትርጉም የለሽነታቸውን ለማስተካከል ","ሁሉም"], a: 3,e:""}, {t: "ቁጣንና ትዕዛዝን የሚያመለክተው ከሚከተሉት ውስጥ የትኛው ስርዓተ ነጥብ ነው?", o: ["እመጫት (^)", "ቃለ አጋኖ፣አቆልቋይ (!)","ይዘት (.)","የመሀል ሰረዝ ነጠላ ሰረዝ (፥)"], a: 1,e:""}, {t: "ፅሁፍን አራርቆ መፃፍ ባልተጀመረበት ጊዜ ቃላትን ከቃላት ለመለየት የምንጠቀምበት ስርዓተ ነጥብ የቱ ነው?", o: ["ሁለት ነጥብ (:)", "ድርብ ሰረዥ (፤)","ትዕምርተ ጥቅስ (« »)","ትዕምርተ ስላቅ (¡)"], a: 0,e:""}, {t: "ምዕራፍን ከንዑስ ቁጥሮች ለመለየት የምንጠቀምባቸው ስርዓተ ነጥቦች የትኞቹ ናቸው?", o: ["ይዘት (.)", "የላይ ሰረዝ ነጠላ ሰረዝ (፣)","የመሀል ሰረዝ ነጠላ ሰረዝ (፥)","የአንደኛውና የሶስተኛው መልስ መሆን ይችላሉ።"], a: 3,e:""}, {t: "ቃላትን አሳጥሮ ለመፃፍ የሚያገለግሉት ስርዓተ ነጥቦች የትኞቹ ናቸው? ", o: ["ሰረዝ (-)", "ይዘት (.)","እዝባር (/)","የሁለተኛውና የሶስተኛው መልስ መሆን ይችላሉ"], a: 3,e:""}]},
            "ቢጋር": { q: [{t: "ቢጋር ማለት ምን ማለት ነው?", o: ["አስተዋፅኦ ማለት ነው።", "አንድን ፅሁፍ ከመፃፋችን በፊት የፅሁፋን ዋናና ዝርዝር ጉዳዮች የምንነድፍበት ነው።","አንድ ፅሁፍ ማራኪ አፃፃፍ እንዲኖረው ከመፃፋችን በፊት የምንሰራው ነው።","ሁሉም መልስ መሆን ይችላሉ።"], a: 3,e:""}, {t: "ከሚከተሉት ውስጥ ቢጋር በየትኞቹ የአነዳደፍ ዘዴዎች ሊቀርብ ይችላል?", o: ["በርዕስ መልክ", "በአጭር መልክ","በአርፍተነገር መልክ","የአንደኛውና የሶስተኛው መልስ ይሆናሉ።"], a: 3,e:""}, {t: "ከሚከተሉት ውስጥ የቢጋር ጥቅም ያልሆነው የቱ ነው?", o: ["የፅሁፍ ሀሳብን ያዛባል።", "ከርዕሰ ጉዳዩ እንዳንወጣ ያግዘናል።","የፅሁፋን ሀሳብ በቅደም ተከተል እንድናስቀምጥ ያደርጋል።","ፍሬ ሀሳቦችን እና ዝርዝር ሀሳቦችን ለማስፈር ያግዛል።"], a: 0,e:""}, {t: "ቢጋር ከሀሳብ አወራረድ አንፃር በስንት ይከፈላል? እነማን ናቸው?", o: ["በሦስት፤ እነሰም፦ የሀላፊ፣ የአሁን እና የትንቢት (የወደፊት) ናቸው። ", "በሁለት ይከፈላሉ። እነሱም ፦ መደበኛ ቢጋር እና ኢ-መደበኛ ቢጋር ናቸው","የተውሳከ ግስ አይነቶች የምንላቸው ናቸው።","መልስ አልተሰጠም"], a: 1,e:""}, {t: "_____ለሀሳብ አወራረዳችን እና ለፅሁፋ ቅደም ተከትል ሳንጨነቅ የምንነድፈው የቢጋር አይነት ነው።", o: ["በርዕስ መልክ የተፃፈ ቢጋር", "መደበኛ ቢጋር","ኢ-መደበኛ ቢጋር","በዓርፍተነገር መልክ የተፃፈ ቢጋር"], a:2,e:""}]},

 let currentTopic = "", currentIdx = 0, score = 0, canAnswer = true;
  function refreshMenu() {

            grid.innerHTML = "";
            let mastered = 0;
            Object.keys(data).forEach(t => {
                const isM = localStorage.getItem('rofam_'+t) === "done";
                if(isM) mastered++;
                const btn = document.createElement('button');
                btn.className = `topic-btn ${isM?'mastered':''}`;

       function resetStats() {
    const confirmReset = confirm("እርግጠኛ ነዎት ውጤቱን ማጽዳት ይፈልጋሉ? (Are you sure you want to reset all progress?)");

         function startQuiz(topic) {
            currentTopic = topic; currentIdx = 0; score = 0;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }
        function CloseAbout(){
            document.getElementById("about-screen").style.display="none"
        }
    function showabout(){
        document.getElementById("about-screen").style.display="block"
    }
        function loadQuestion() {
            canAnswer = true;
            const q = data[currentTopic].q[currentIdx];
            document.getElementById('quiz-title').innerText = currentTopic;
            document.getElementById('question-text').innerText = q.t;
            document.getElementById('q-counter').innerText = `Question ${currentIdx+1} of ${data[currentTopic].q.length}`;
            document.getElementById('explanation-box').style.display = 'none';
            document.getElementById('next-button').style.display = 'none';

            const container = document.getElementById('options-container');
            container.innerHTML = "";
            q.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, btn);
                container.appendChild(btn);
            });
        }
        function checkAnswer(choice, btn) {
            if(!canAnswer) return;
            canAnswer = false;
            const correctIdx = data[currentTopic].q[currentIdx].a;
            const allBtns = document.querySelectorAll('.option-btn');

            if(choice === correctIdx) {
                btn.classList.add('correct-glow');
                score++;
            } else {
                btn.classList.add('wrong-glow');
                allBtns[correctIdx].classList.add('correct-glow');
            }

            document.getElementById('explanation-text').innerText = data[currentTopic].q[currentIdx].e;
            document.getElementById('explanation-box').style.display = 'block';
            document.getElementById('next-button').style.display = 'block';
        }

        function nextQuestion() {
            currentIdx++;
            if(currentIdx < data[currentTopic].q.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const pass = score >= (data[currentTopic].q.length * 0.8);
            alert(`ምዘናው ተጠናቋልⵆ ነጥብ፡ ${score}/${data[currentTopic].q.length}`);
            if(pass) {
                localStorage.setItem('rofam_'+currentTopic, "done");
                alert("የምዘናው ውጤት አልፈሀል⁄ሻል 🎉");
            }
            exitQuiz();
        }

        function exitQuiz() {
            
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden')
            
            refreshMenu();
            
        }

        refreshMenu();
        changeLang('am');
    renderButtons();
